<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
    <title>Tetris</title>
</head>
<body>
    <div class="tetris-board">
        <div class="block i" id="i1"></div>
        <div class="block i" id="i2"></div>
        <div class="block i" id="i3"></div>
        <div class="block i" id="i4"></div>

        <div class="block o" id="o1"></div>
        <div class="block o" id="o2"></div>
        <div class="block o" id="o3"></div>
        <div class="block o" id="o4"></div>

        <div class="block t" id="t1"></div>
        <div class="block t" id="t2"></div>
        <div class="block t" id="t3"></div>
        <div class="block t" id="t4"></div>

        <div class="block l" id="l1"></div>
        <div class="block l" id="l2"></div>
        <div class="block l" id="l3"></div>
        <div class="block l" id="l4"></div>

        <div class="block z" id="z1"></div>
        <div class="block z" id="z2"></div>
        <div class="block z" id="z3"></div>
        <div class="block z" id="z4"></div>
    </div>
</body>
</html>
